# PricePilot — Continuous Integration
#
# Phase 3: Complete desktop and mobile browser matrix.
#
# Three independent jobs:
#   1. Verification: typecheck + lint + unit tests + coverage + build
#   2. Desktop E2E: Chromium, Firefox, WebKit against production build
#   3. Mobile E2E: Pixel 7, iPhone 14, iPad against production build
#
# Desktop and Mobile E2E are independent required checks.
# A failure in one does NOT cancel the other.
#
# Vercel preview deployments are triggered automatically by the Vercel
# GitHub integration — they are not duplicated here.

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel in-progress runs when a new commit is pushed to the SAME ref.
# Do NOT cancel individual jobs within a run — they must all complete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -----------------------------------------------------------------
  # Verification job: typecheck + lint + unit tests + coverage + build
  # -----------------------------------------------------------------
  verify:
    name: Verification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Test with coverage
        run: bun run test:coverage

      - name: Build
        run: bun run build

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

  # -----------------------------------------------------------------
  # E2E job: Desktop Playwright tests against the production build
  # -----------------------------------------------------------------
  e2e-desktop:
    name: Desktop E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium firefox webkit

      - name: Build production app
        run: bun run build

      - name: Run Desktop E2E tests
        run: bun run test:e2e:desktop
        env:
          CI: 'true'

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-desktop
          path: playwright-report/
          retention-days: 14

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-desktop
          path: test-results/
          retention-days: 14

      - name: Upload screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-desktop
          path: test-results/**/*.png
          retention-days: 14

      - name: Upload videos
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: videos-desktop
          path: test-results/**/*.webm
          retention-days: 14

      - name: Upload traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: traces-desktop
          path: test-results/**/*.zip
          retention-days: 14

  # -----------------------------------------------------------------
  # E2E job: Mobile / Tablet Playwright tests against the production build
  # -----------------------------------------------------------------
  e2e-mobile:
    name: Mobile E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium firefox webkit

      - name: Build production app
        run: bun run build

      - name: Run Mobile E2E tests
        run: bun run test:e2e:mobile
        env:
          CI: 'true'

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-mobile
          path: playwright-report/
          retention-days: 14

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-mobile
          path: test-results/
          retention-days: 14

      - name: Upload screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-mobile
          path: test-results/**/*.png
          retention-days: 14

      - name: Upload videos
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: videos-mobile
          path: test-results/**/*.webm
          retention-days: 14

      - name: Upload traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: traces-mobile
          path: test-results/**/*.zip
          retention-days: 14
