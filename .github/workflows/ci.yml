# PricePilot — Continuous Integration
#
# Phase 18 (production-readiness): enforce full verification on every
# pull request and every push to `main`. The build, lint, unit tests,
# coverage thresholds, and E2E tests must all pass before a PR can be
# merged.
#
# Vercel preview deployments are triggered automatically by the Vercel
# GitHub integration — they are not duplicated here.
#
# Branch protection on `main` should require:
#   - This CI workflow to pass
#   - The Vercel preview check to pass
#   - A pull request with at least one review (for the solo owner,
#     self-review is acceptable)
#   - The branch to be up-to-date before merge

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel in-progress runs when a new commit is pushed.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -----------------------------------------------------------------
  # Verification job: typecheck + lint + unit tests + coverage + build
  # -----------------------------------------------------------------
  verify:
    name: Typecheck, Lint, Test, Coverage, Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Test with coverage
        run: bun run test:coverage

      - name: Enforce coverage thresholds
        run: |
          # The vitest config already enforces thresholds via the
          # `coverage.thresholds` block. If thresholds are not met,
          # `bun run test:coverage` exits non-zero. This step is a
          # placeholder for any future additional enforcement logic.
          echo "Coverage thresholds enforced by vitest.config.ts"

      - name: Build
        run: bun run build

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

  # -----------------------------------------------------------------
  # E2E job: Playwright tests against the production build
  # -----------------------------------------------------------------
  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      - name: Build production app
        run: bun run build

      - name: Run E2E tests
        run: bun run test:e2e
        env:
          CI: 'true'

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 14

      - name: Upload screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshot*.png
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: traces
          path: test-results/**/trace.zip
          if-no-files-found: ignore
          retention-days: 14
